sonar.projectKey=aik-mcp
sonar.projectName=Aik MCP

sonar.sources=src

# Test files (unit + e2e) co-located under src.
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts

# Exclude test files from copy/paste (duplication) detection.
sonar.cpd.exclusions=src/**/*.test.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.lcov.reportPaths=dist/coverage/lcov.info

# All generated artifacts live under dist/ so a single entry in .gitignore covers them.
sonar.working.directory=dist/.scannerwork
